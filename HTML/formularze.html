<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularze</title>
</head>
<body>
    <form action="" method="post">
        <label for="nazwa">
            Nazwa:
        </label>
        <input id="nazwa" name="name" placeholder="Nazwa" type="text">
        <input name="email" placeholder="email" type="email">
        <input name="password" placeholder="Hasło" type="password">


        <input name="regulamin" type="checkbox">

        <textarea>Testowy tekst</textarea>

        <select name="klasa">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>

        <button type="reset">Resetuj formularz</button>
        <button type="submit">Zapisz</button>
    </form>
</body>
</html>
